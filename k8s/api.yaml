apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: policy-claims
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: api:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            - name: CLIENT_ORIGIN
              value: "http://localhost:30080"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kubernetes-secrets
                  key: JWT_SECRET
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: kubernetes-secrets
                  key: MONGODB_URI
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: policy-claims
spec:
  selector:
    app: api
  ports:
    - port: 4000
      targetPort: 4000