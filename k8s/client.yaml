apiVersion: apps/v1
kind: Deployment
metadata: 
 name: client 
 namespace: policy-claims
spec:
  replicas: 1
  selector: 
   matchLabels: 
    app: client
  template:
    metadata: 
     labels: 
      app: client
    spec:
      containers:
      - name: client
        image: client:latest
        imagePullPolicy: Never
        ports: 
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata: 
 name: client 
 namespace: policy-claims
spec:
  type: NodePort
  selector: 
   app: client
  ports: 
  - port: 80 
    targetPort: 80 
    nodePort: 30080