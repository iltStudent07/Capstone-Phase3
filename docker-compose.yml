services:
  mongo:
    image: mongo:7
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build: ./api
    ports:
      - "4000:4000"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/policy-claims
      - JWT_SECRET=dev-capstone-secret
      - PORT=4000
    depends_on:
      mongo:
        condition: service_healthy

  client:
    build: ./client
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  mongo-data: